<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scientific Calculator</title>
  <style>
    :root{
      --bg:#0f1724; --panel:#0b1220; --accent:#10b981; --muted:#94a3b8; --key:#111827; --key2:#1f2937;
      --glass: rgba(255,255,255,0.03);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071125 0%, #071b2a 100%);color:#e6eef6}
    .calculator{width:360px;margin:40px auto;padding:18px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    .screen{background:var(--panel);padding:12px;border-radius:10px;min-height:72px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
    .expr{font-size:14px;color:var(--muted);opacity:0.95;text-align:right;width:100%;overflow:auto}
    .output{font-size:26px;font-weight:600;margin-top:6px;text-align:right;word-break:break-all}
    .row{display:flex;gap:8px;margin-top:12px}
    button.key{flex:1;padding:14px;border-radius:8px;border:0;background:var(--glass);color:inherit;font-size:16px;cursor:pointer}
    button.key:active{transform:translateY(1px)}
    .key.func{background:linear-gradient(180deg,var(--key2), #0b1220);color:var(--muted)}
    .key.op{background:linear-gradient(180deg,#062433,#04202e);color:var(--accent)}
    .wide{flex:2}
    .top-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .small-btn{background:transparent;border:1px solid rgba(161, 80, 80, 0.04);padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
    .footer{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
    @media (max-width:420px){.calculator{width:94%;}}
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Scientific calculator">
    <div class="top-controls">
      <div>
        <button class="small-btn" id="degToggle">Radians</button>
        <button class="small-btn" id="clearAll">AC</button>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--muted)">Scientific Calculator</div>
      </div>
    </div>

    <div class="screen">
      <div id="expression" class="expr">0</div>
      <div id="output" class="output">0</div>
    </div>

    <!-- buttons -->
    <div class="row" style="margin-top:14px">
      <button class="key func" data-action="func" data-value="sin(">sin</button>
      <button class="key func" data-action="func" data-value="cos(">cos</button>
      <button class="key func" data-action="func" data-value="tan(">tan</button>
      <button class="key func" data-action="func" data-value="log(">log</button>
    </div>

    <div class="row">
      <button class="key func" data-action="func" data-value="ln(">ln</button>
      <button class="key func" data-action="func" data-value="sqrt(">√</button>
      <button class="key func" data-action="func" data-value="pow(">x^y</button>
      <button class="key op" data-action="op" data-value="/">÷</button>
    </div>

    <div class="row">
      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key op" data-action="op" data-value="*">×</button>
    </div>

    <div class="row">
      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key op" data-action="op" data-value="-">−</button>
    </div>

    <div class="row">
      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key op" data-action="op" data-value="+">+</button>
    </div>

    <div class="row">
      <button class="key" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key func" data-action="func" data-value="pi">π</button>
      <button class="key" id="equals">=</button>
    </div>

    <div class="row">
      <button class="key func wide" data-action="func" data-value="(" >( </button>
      <button class="key func" data-action="func" data-value=")"> ) </button>
      <button class="key func" data-action="func" data-value="fact(">n!</button>
    </div>

    <div class="footer">Supports: sin/cos/tan, log (base10), ln, sqrt, pow(a,b), fact(n). Use decimal points and parentheses. JS-style decimal arithmetic.</div>
  </div>

  <script>
    (()=>{
      const exprEl = document.getElementById('expression');
      const outEl = document.getElementById('output');
      const degToggle = document.getElementById('degToggle');
      const clearAll = document.getElementById('clearAll');
      let deg = false; // radians by default
      let expr = '';

      function render(){
        exprEl.textContent = expr || '0';
        try{
          const val = evaluateExpression(expr || '0');
          outEl.textContent = (typeof val === 'number' && !Number.isFinite(val))? 'Error' : String(val);
        }catch(e){ outEl.textContent = '—'; }
      }

      degToggle.addEventListener('click', ()=>{deg = !deg; degToggle.textContent = deg? 'Degrees' : 'Radians'; render();});
      clearAll.addEventListener('click', ()=>{expr=''; render();});

      document.querySelectorAll('.key').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const v = btn.dataset.value;
          const action = btn.dataset.action || null;
          if(btn.id === 'equals'){ // evaluate
            try{ expr = String(evaluateExpression(expr)); }catch(e){ expr = 'Error'; }
            render();
            return;
          }
          if(action === 'func'){
            // insert function token or constant
            if(v === 'pi') expr += 'pi';
            else expr += v;
          } else if(action === 'op'){
            expr += v;
          } else {
            expr += v;
          }
          render();
        });
      });

      // keyboard support
      window.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ try{ expr = String(evaluateExpression(expr)); }catch(err){ expr='Error'; } render(); e.preventDefault(); }
        else if(e.key === 'Backspace'){ expr = expr.slice(0,-1); render(); }
        else if(/^[0-9.+\-*/()]*$/.test(e.key)) { expr += e.key; render(); }
      });

      // evaluator with safe wrappers for math functions
      function fact(n){ if(n<0) return NaN; if(n===0) return 1; n = Math.floor(n); let r=1; for(let i=2;i<=n;i++) r*=i; return r; }

      function evaluateExpression(input){
        if(!input || input.trim()==='') return 0;
        // basic sanitization: allow digits, operators, parentheses, dot, comma, and letters for function names
        if(/[^0-9+\-*/().,\sA-Za-z_pi]/.test(input)) throw new Error('Invalid characters');

        const sin = x => deg? Math.sin(x*Math.PI/180) : Math.sin(x);
        const cos = x => deg? Math.cos(x*Math.PI/180) : Math.cos(x);
        const tan = x => deg? Math.tan(x*Math.PI/180) : Math.tan(x);
        const asin = x => deg? (Math.asin(x)*180/Math.PI) : Math.asin(x);
        const acos = x => deg? (Math.acos(x)*180/Math.PI) : Math.acos(x);
        const atan = x => deg? (Math.atan(x)*180/Math.PI) : Math.atan(x);
        const log = x => Math.log10(x);
        const ln = x => Math.log(x);
        const sqrt = x => Math.sqrt(x);
        const pow = (a,b) => Math.pow(a,b);
        const pi = Math.PI;
        const e = Math.E;

        // factorial function name: fact(n)
        const fn_fact = fact;

        // Replace common unicode pi symbol with 'pi'
        const sanitized = input.replace(/π/g, 'pi');

        // Build a Function with only the allowed names in scope
        const func = new Function('sin','cos','tan','asin','acos','atan','log','ln','sqrt','pow','pi','e','fact','return ('+ sanitized +')');
        return func(sin,cos,tan,asin,acos,atan,log,ln,sqrt,pow,pi,e,fn_fact);
      }

      // initial render
      render();
    })();
  </script>
</body>
</html>
